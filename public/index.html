<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edtekno Lead Scraper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css?v=23" />
</head>

<body>

  <!-- ===== LOGIN ===== -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <div class="login-logo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
      </div>
      <h1>Edtekno Lead Scraper</h1>
      <p class="login-sub">Masuk untuk melanjutkan</p>
      <label for="login-username">Username</label>
      <input id="login-username" type="text" autocomplete="username" placeholder="Masukkan username" required />
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="Masukkan password"
        required />
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      <p id="login-error" class="login-error hidden"></p>
    </form>
  </div>

  <!-- ===== APP ===== -->
  <div id="app-view" class="app hidden">
    <!-- Top Mobile Bar (Mobile-First) -->
    <header class="mobile-header">
      <button id="btn-mobile-menu" class="btn-icon mobile-menu-btn" aria-label="Buka navigasi menu" title="Buka menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <div class="mobile-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <span>Lead Scraper</span>
      </div>
      <div class="mobile-user" id="mobile-user-name">user</div>
    </header>

    <!-- Mobile Drawer Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-left">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <span>Lead Scraper</span>
        </div>
        <button id="btn-sidebar-close" class="btn-icon sidebar-close-btn" aria-label="Tutup navigasi"
          title="Tutup menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-page="dashboard">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="1" />
            <rect x="14" y="3" width="7" height="5" rx="1" />
            <rect x="14" y="12" width="7" height="9" rx="1" />
            <rect x="3" y="16" width="7" height="5" rx="1" />
          </svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-page="scrape">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          <span>Scrape Data</span>
        </button>
        <button class="nav-item" data-page="results">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <path d="M3 3h18v18H3z" />
            <path d="M3 9h18" />
            <path d="M3 15h18" />
          </svg>
          <span>Hasil Leads</span>
        </button>
        <button class="nav-item" data-page="dedup">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <rect x="8" y="8" width="13" height="13" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
          </svg>
          <span>Review Duplikat</span>
          <span id="dedup-badge" class="badge hidden"></span>
        </button>
        <button id="nav-users" class="nav-item hidden" data-page="users">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span>Kelola Pengguna</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div style="display:flex; align-items:center; gap:8px;">
          <span id="user-name" class="user-name"></span>
          <button id="btn-sound-toggle" class="btn-icon" title="Suara Notifikasi: Aktif" aria-label="Toggle Suara Notifikasi" style="color:var(--muted); padding:4px; display:inline-flex; align-items:center;">
          </button>
        </div>
        <button id="btn-logout" class="btn btn-ghost btn-sm" style="display:inline-flex; align-items:center; gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Keluar</span>
        </button>
      </div>
    </aside>

    <main class="main" id="app-main">
      <!-- Views dimuat secara modular dari public/views/ (*.html) -->
      <div id="views-loading" class="muted text-center" style="padding: 40px;">
        <svg class="spin-svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <p style="margin-top: 10px;">Memuat antarmuka...</p>
      </div>
    </main>
  </div>

  <!-- Root Container untuk Modals -->
  <div id="modals-root"></div>

  <!-- ===== TOAST NOTIFICATIONS ===== -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- ===== SCREEN LOADING OVERLAY (DEDUP & DATA SYNC) ===== -->
  <div id="dedup-loading-overlay" class="dedup-loading-overlay hidden" role="status" aria-live="assertive">
    <div class="dedup-loading-card">
      <div class="dedup-loading-icon-wrap">
        <svg class="spin-svg dedup-spinner" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </div>
      <h4 id="dedup-loading-title">Memperbarui Data Duplikat</h4>
      <p id="dedup-loading-desc" class="muted">Mohon tunggu sebentar, data sedang diselaraskan...</p>
    </div>
  </div>

  <script src="app.js?v=28"></script>
</body>

</html>
